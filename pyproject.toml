[project]
name = "contextsmith"
version = "2.2.0"
description = "Model-aware agent instruction engineering toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
contextsmith-orchestrator = "orchestrator.cli:main"

[project.entry-points."contextsmith.adapters"]
opencode = "orchestrator.adapters.opencode"
generic = "orchestrator.adapters.generic"

[project.optional-dependencies]
opencode = []
generic = []
dev = ["pytest>=9.0.3", "ruff>=0.15.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator/"]
